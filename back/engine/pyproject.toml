[project]
name = "cv-tailor-engine"
version = "0.1.0"
description = "Core rendering, fit loop, and validation engine for CV Tailor"
license = { text = "FSL-1.1-MIT" }
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10.0",
    "typst>=0.12.0",
    "httpx>=0.28.1",
    "pypdf>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
