[project]
name = "cv-tailor"
version = "0.1.0"
description = "Deterministic 1-page AI CV tailoring engine and CLI"
readme = "README.md"
license = { text = "FSL-1.1-MIT" }
requires-python = ">=3.12"
dependencies = [
    "cv-tailor-engine",
    "fastapi>=0.115.0",
    "httpx>=0.28.1",
    "pypdf>=5.0.0",
    "python-multipart>=0.0.18",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
cvt = "back.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
]

[tool.uv.workspace]
members = ["back/engine"]

[tool.uv.sources]
cv-tailor-engine = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["back"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "back"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
